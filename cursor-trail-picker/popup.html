<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .preview { height: 72px; border: 1px dashed #888; border-radius: 8px; display: flex;
             align-items: center; justify-content: center; margin-bottom: 10px; font-size: 40px; }
  .preview img { max-width: 64px; max-height: 64px; }
  button { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid #888;
           background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row button { flex: 1; }
  label { display: block; margin: 8px 0 2px; }
  label span { float: right; opacity: .7; }
  input[type=range] { width: 100%; }
  .check { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .note { opacity: .7; font-size: 12px; margin-top: 10px; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>Cursor Trail</h1>
  <div class="preview" id="preview">✨</div>

  <div class="row">
    <button class="primary" id="choose">Choose image…</button>
    <button id="reset">Reset</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <label>Size <span id="sizeVal"></span></label>
  <input type="range" id="size" min="8" max="96" step="1">

  <label>Trail length <span id="lengthVal"></span></label>
  <input type="range" id="length" min="3" max="60" step="1">

  <div class="check"><input type="checkbox" id="spin"><label for="spin" style="margin:0">Spin</label></div>
  <div class="check"><input type="checkbox" id="fade"><label for="fade" style="margin:0">Fade</label></div>
  <div class="check"><input type="checkbox" id="enabled"><label for="enabled" style="margin:0">Trail on</label></div>

  <div class="note">
    Changes apply instantly to open tabs. GIFs show as a still image.
    If the file picker closes the popup, <a href="#" id="tab">open this in a tab</a>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
